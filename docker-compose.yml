# docker compose up                          -> app at http://localhost:3000
# docker compose --profile index run --rm indexer   -> (re)index every configured book from ./out/<book>
# docker compose --profile index run --rm indexer ingest --book vol2   -> one book
# docker compose down -v                     -> clean slate (drops the database volume)
#
# Secrets and model settings come from .env (see .env.example). ./data (PDFs and
# page-image directories named in config/books.json) is mounted read-only into
# the api container at /data; ./out is mounted into the indexer at /app/out.
# Only the retake services (the retake CLI, profile "retake", and retake-worker) mount ./data and ./out
# read-write.

x-node-image: &node-image
  build:
    context: .
    target: runtime
  image: miriel-node

x-db-url: &db-url postgres://miriel:miriel@db:5432/miriel

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: miriel
      POSTGRES_PASSWORD: miriel
      POSTGRES_DB: miriel
    ports:
      - "5432:5432" # for `npm run dev` on the host; remove if unwanted
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miriel -d miriel"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Same policy as api and web, so a Docker Desktop restart brings the whole stack back.
    restart: unless-stopped

  migrate:
    <<: *node-image
    command: ["node", "packages/indexer/dist/cli.js", "migrate"]
    environment:
      DATABASE_URL: *db-url
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  indexer:
    <<: *node-image
    profiles: ["index"]
    entrypoint: ["/sbin/tini", "--", "node", "packages/indexer/dist/cli.js"]
    command: ["ingest", "--all"]
    env_file: .env
    environment:
      DATABASE_URL: *db-url
    volumes:
      - ./out:/app/out:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    <<: *node-image
    command: ["node", "packages/api/dist/main.js"]
    env_file: .env
    environment:
      DATABASE_URL: *db-url
      DATA_DIR: /data
      THUMB_CACHE_DIR: /cache/thumbs
      HOST: 0.0.0.0
      PORT: "8080"
      CORS_ORIGIN: "" # same origin behind nginx
      # Overridable from the shell for testing, e.g. CITATIONS_MODE=inline docker compose up -d api
      CITATIONS_MODE: ${CITATIONS_MODE:-citations}
      ANSWER_MODEL: ${ANSWER_MODEL:-claude-sonnet-5}
      RERANK_ENABLED: ${RERANK_ENABLED:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Page retakes: the routes exist only with RETAKE_ENABLED=true; RETAKE_TOKEN (optional) guards uploads/confirms.
      RETAKE_ENABLED: ${RETAKE_ENABLED:-false}
      RETAKE_TOKEN: ${RETAKE_TOKEN:-}
      UPLOAD_DIR: /uploads
    volumes:
      - ./data:/data:ro
      - thumbs:/cache/thumbs
      - uploads:/uploads # retake photos waiting for the worker (the api's only writable storage)
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # Page retakes (scripts/retake.py), one-shot: npm run retake -- --book vol1 --page 289 --image page_290.jpg
  # The only service that writes source files: ./data and ./out read-write. Photos are read from
  # RETAKE_INBOX (default ./retakes); relative --image/--dir paths resolve against it. RETAKE_DATA,
  # RETAKE_OUT and RETAKE_DATABASE_URL point a run at a sandbox copy instead of the real books.
  retake:
    build:
      context: .
      target: retake
    image: miriel-retake
    profiles: ["retake"]
    env_file: .env
    environment:
      DATABASE_URL: ${RETAKE_DATABASE_URL:-postgres://miriel:miriel@db:5432/miriel}
      DATA_DIR: /data
      THUMB_CACHE_DIR: /cache/thumbs
      RETAKE_INBOX: /retakes
      RETAKE_DAILY_BUDGET_USD: ${RETAKE_DAILY_BUDGET_USD:-10}
    volumes:
      - ${RETAKE_DATA:-./data}:/data
      - ${RETAKE_OUT:-./out}:/app/out
      - ${RETAKE_INBOX:-./retakes}:/retakes:ro
      - thumbs:/cache/thumbs
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  # Retake worker: validates uploaded photos and runs confirmed retake jobs (retake_jobs table) with
  # scripts/retake.py. Idle unless the api has RETAKE_ENABLED=true and someone uploads. Jobs of one book run
  # one at a time; a job interrupted by a restart resumes from its journal.
  retake-worker:
    build:
      context: .
      target: retake
    image: miriel-retake
    entrypoint: ["/usr/bin/tini", "--", "node", "packages/worker/dist/main.js"]
    command: []
    env_file: .env
    environment:
      DATABASE_URL: ${RETAKE_DATABASE_URL:-postgres://miriel:miriel@db:5432/miriel}
      DATA_DIR: /data
      THUMB_CACHE_DIR: /cache/thumbs
      UPLOAD_DIR: /uploads
      RETAKE_DAILY_BUDGET_USD: ${RETAKE_DAILY_BUDGET_USD:-10}
    volumes:
      - ${RETAKE_DATA:-./data}:/data
      - ${RETAKE_OUT:-./out}:/app/out
      - uploads:/uploads
      - thumbs:/cache/thumbs
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 20s
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
    image: miriel-web
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  dbdata:
  thumbs: # page thumbnails generated on demand by the api
  uploads: # retake photos: written by the api, read (and cleaned up) by the retake worker
