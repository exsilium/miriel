# Phase 1: database only. Later phases add migrate, indexer, api, web.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: miriel
      POSTGRES_PASSWORD: miriel
      POSTGRES_DB: miriel
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miriel -d miriel"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  dbdata:
