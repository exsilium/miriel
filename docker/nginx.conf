server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resolve the api service through Docker's embedded DNS at request time,
    # so nginx starts even if api is not up yet and follows api restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8080;

    gzip on;
    gzip_types text/css application/javascript application/json text/javascript;
    gzip_min_length 1024;

    # Streaming chat: never buffer, never time out on a long answer.
    location = /api/chat {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        chunked_transfer_encoding on;
    }

    # Everything else on the API, including the PDF (Range requests pass through;
    # no temp files so a 250 MB PDF is never spooled to disk).
    location /api/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 300s;
    }

    # Hashed Vite assets are immutable.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
